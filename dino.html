<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Run</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link rel="stylesheet" href="css/stylemenu.css" />
<link rel="stylesheet" href="css/styledino.css" /> 
</head>
<body>

<!-- Menu -->
<div id="menu-container"></div>

<!-- JEU -->
<div class="global">
<div class="game-container">
    <div class="game-header">
        Dino Run
    </div>
    
    <div class="game-canvas-container">
        <canvas id="game-canvas"></canvas>
        
        <div class="score-board">
            Score: <span id="score">0</span>
        </div>
        
        <div id="start-screen" class="start-screen">
            <h2>Dino Run</h2>
            <p>Appuyez sur ESPACE ou cliquez pour sauter et éviter les cactus !</p>
            <button id="start-button">Commencer</button>
        </div>
        
        <div id="game-over-screen" class="game-over-screen hidden">
            <h2>Game Over!</h2>
            <p>Votre score: <span id="final-score">0</span></p>
            <button id="restart-button">Rejouer</button>
        </div>
    </div>
    
    <div class="game-controls">
        <button id="action-button">Sauter!</button>
        <p class="instructions">Ou utilisez la barre ESPACE ou cliquez sur l'écran</p>
    </div>
</div>
</div>

<script src="js/scriptdino.js"></script>
<script src="js/load-menu.js"></script>
</body>
</html>
