<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mes TPs - Alexandre Bossiaux</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link rel="stylesheet" href="css/stylemenu.css" />
<link rel="stylesheet" href="css/styletps.css" />

</head>
<body>

<!-- Menu -->
<div id="menu-container"></div>

<!-- Page TPs -->
<div class="global">
  <div class="tp-header">
    <h2>Mes Travaux Pratiques</h2>
    <p>Découvrez mes travaux pratiques réalisés durant ma formation BTS SIO</p>
  </div>

  <!-- Sélection année -->
  <div class="year-selector">
    <button class="year-btn active" data-year="1">SIO 1ère Année</button>
    <button class="year-btn" data-year="2">SIO 2ème Année</button>
  </div>

  <!-- Sélection bloc -->
  <div class="bloc-selector">
    <button class="bloc-btn active" data-bloc="1">Bloc 1</button>
    <button class="bloc-btn" data-bloc="2">Bloc 2</button>
    <button class="bloc-btn" data-bloc="3">Bloc 3</button>
  </div>

  <!-- Contenu -->
  <div class="tp-content" id="tp-container">
    <div class="empty-state">
      <p>Sélectionnez une année et un bloc pour voir les travaux pratiques</p>
    </div>
  </div>
</div>

<!-- Modal pour afficher les PDFs -->
<div id="pdfModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">TP</h3>
      <button class="modal-close" id="closeModal">&times;</button>
    </div>
    <div class="modal-body">
      <iframe id="pdfViewer"></iframe>
    </div>
  </div>
</div>

<script src="js/load-menu.js"></script>
<script src="js/scripttps.js"></script>

</body>
</html>
